[project]
name = "celery-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.10"
dependencies = [
    "celery>=5.6.2",
    "django-ninja>=1.5.3",
    "pydantic>=2.12.5",
    "redis>=7.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
